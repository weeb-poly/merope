[project]
name = "discord-reg-bot"
version = "0.0.0"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "discord-py>=2.7.1",
]

[project.scripts]
bot = "discord_reg_bot.__main__:main"
setup_db = "discord_reg_bot.scripts.setup_db:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13"]
build-backend = "uv_build"
