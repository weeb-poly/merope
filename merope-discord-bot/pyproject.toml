[project]
name = "merope-discord-bot"
version = "0.0.0"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "discord-py>=2.7.1",
]

[project.scripts]
merope-discord-bot = "merope_discord_bot.__main__:main"
merope-discord-bot-setup-db = "merope_discord_bot.scripts.setup_db:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13"]
build-backend = "uv_build"
